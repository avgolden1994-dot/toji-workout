@keyframes hL{0%{transform:translate(860.46px,144.89px) rotate(0deg) translate(-860.46px,-144.89px)}3%{transform:translate(860.46px,144.89px) rotate(0deg) translate(-860.46px,-144.89px);animation-timing-function:cubic-bezier(.45,0,.55,1)}47%{transform:translate(860.46px,144.89px) rotate(-80deg) translate(-860.46px,-144.89px)}53%{transform:translate(860.46px,144.89px) rotate(-80deg) translate(-860.46px,-144.89px);animation-timing-function:cubic-bezier(.45,0,.55,1)}97%{transform:translate(860.46px,144.89px) rotate(0deg) translate(-860.46px,-144.89px)}100%{transform:translate(860.46px,144.89px) rotate(0deg) translate(-860.46px,-144.89px)}}
