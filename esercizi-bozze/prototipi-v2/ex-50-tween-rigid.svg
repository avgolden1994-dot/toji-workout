@keyframes cL{0%{transform:translate(866px,108.5px) rotate(0deg) translate(-866px,-108.5px)}3%{transform:translate(866px,108.5px) rotate(0deg) translate(-866px,-108.5px);animation-timing-function:cubic-bezier(.45,0,.55,1)}47%{transform:translate(866px,108.5px) rotate(44deg) translate(-866px,-108.5px)}53%{transform:translate(866px,108.5px) rotate(44deg) translate(-866px,-108.5px);animation-timing-function:cubic-bezier(.45,0,.55,1)}97%{transform:translate(866px,108.5px) rotate(0deg) translate(-866px,-108.5px)}100%{transform:translate(866px,108.5px) rotate(0deg) translate(-866px,-108.5px)}}
