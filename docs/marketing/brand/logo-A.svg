<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 66" width="96" height="66" role="img" aria-label="3in">
  <title>3in - direzione A «Pieno»</title>
  <!-- Wordmark geometrico disegnato a mano (nessun font). Peso pieno come il titolo «OGGI» (css/oggi-e-lettore.css:86, font-weight 900).
       Colori: tema chiaro = --text/--bg scuro e --primary #c2410c (css/base.css:86); tema scuro = --text #f3f3f6 e --primary #fb8b3c (css/base.css:33,38). -->
  <style>
    .ink-s{stroke:#0e0e12}.acc-f{fill:#c2410c}
    @media (prefers-color-scheme: dark){.ink-s{stroke:#f3f3f6}.acc-f{fill:#fb8b3c}}
  </style>
  <g fill="none" stroke-width="11" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- 3: due archi sovrapposti -->
    <path class="ink-s" d="M5 12.5 H22 A9.75 9.75 0 0 1 22 32 H14 M22 32 A11.25 11.25 0 0 1 22 54.5 H5"/>
    <!-- i: asta -->
    <path class="ink-s" d="M52 27 V60"/>
    <!-- n -->
    <path class="ink-s" d="M67 27 V60 M67 38 A10 10 0 0 1 87 38 V60"/>
  </g>
  <!-- punto della i: il «disco» arancio, l'unico accento -->
  <rect class="acc-f" x="46.5" y="6" width="11" height="11"/>
</svg>
